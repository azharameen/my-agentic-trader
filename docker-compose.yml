# =============================================================================
# NIFTY 100 Swing Trading Assistant — Docker Compose (ADR-023)
#
# Services:
#   postgres       : PostgreSQL 16 Alpine sidecar persistence layer for
#                    checkpoints, store, audit logs, outbox, and cache.
#   trading-engine : LangGraph pipeline + Telegram long-polling bot. Telegram
#                    is the complete control plane (/scan, /run, /trades,
#                    approval buttons, /performance) — no web port is exposed.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nifty-trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trader_db}
      POSTGRES_USER: ${POSTGRES_USER:-trader_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader_admin} -d ${POSTGRES_DB:-trader_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trading-net

  trading-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: nifty-swing-trading:latest
    container_name: nifty-trading-engine
    command: ["python", "-m", "app.main", "serve"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trader_admin}:${POSTGRES_PASSWORD:-trader_secret}@postgres:5432/${POSTGRES_DB:-trader_db}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import app.db as db, time, pathlib, sys; db.init_all_tables(); p = pathlib.Path('data/bot_heartbeat'); sys.exit(0 if p.exists() and (time.time() - p.stat().st_mtime) < 90 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - trading-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: nifty-swing-trading:latest
    container_name: nifty-trading-dashboard
    command: ["python", "-m", "app.main", "dashboard", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trader_admin}:${POSTGRES_PASSWORD:-trader_secret}@postgres:5432/${POSTGRES_DB:-trader_db}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - trading-net

volumes:
  pgdata:
    driver: local

networks:
  trading-net:
    driver: bridge
