# =============================================================================
# NIFTY 100 Swing Trading Assistant — Docker Compose
#
# Single service:
#   trading-engine : LangGraph pipeline + Telegram long-polling bot. Telegram
#                    is the complete control plane (/scan, /run, /trades,
#                    approval buttons) — no web port is exposed.
#
# The audit DB and checkpoints live on the persistent ./data volume.
# =============================================================================

services:
  trading-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: nifty-swing-trading:latest
    container_name: nifty-trading-engine
    command: ["python", "-m", "app.main", "serve"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Long polling means no inbound ports are required for Telegram.
    restart: unless-stopped
    healthcheck:
      # Verifies both DB connectivity and that the bot's long-poll loop is
      # alive (it touches data/bot_heartbeat every ~30s); a hung poll loop
      # (not just a dead process) now fails the healthcheck.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import app.executor as e, time, pathlib, sys; e.init_db(); p = pathlib.Path('data/bot_heartbeat'); sys.exit(0 if p.exists() and (time.time() - p.stat().st_mtime) < 90 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge
